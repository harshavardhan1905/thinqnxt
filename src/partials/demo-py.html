<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curriculum Scroll</title>

<style>
/* ===== SCROLL STRUCTURE ===== */
.cur-con-sec{
  position: relative;
  height: 400vh; /* 🔑 THIS creates scroll */
}

.cur-con-sticky{
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  overflow: hidden;
}

/* ===== LEFT PYRAMID ===== */
.py-pyramid{
  width: 30%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  transform: scale(1.2);
}

/* ===== RIGHT CONTENT ===== */
.skills-scroll-wrapper{
  position: relative;
  width: 70%;
  height: 100%;
}

/* ===== PANELS ===== */
.skills-panel{
  position: absolute;
  inset: 0;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.45s ease;
}

.skills-panel.is-active{
  opacity: 1;
  pointer-events: auto;
}

/* ===== FIXED WIDTH BUG ===== */
.skill-track-section{
  width: 100%;
  max-width: 1100px;
  margin: auto;
  padding: 60px 20px;
  font-family: Inter, system-ui, sans-serif;
}

/* ===== PYRAMID SHAPES ===== */
.py-level{
  height: 0;
  border-left: solid transparent;
  border-right: solid transparent;
  transition: 0.3s;
}

.py-l1{border-left-width:60px;border-right-width:60px;border-bottom:40px solid #e5e7eb;}
.py-l2{border-left-width:90px;border-right-width:90px;border-bottom:50px solid #e5e7eb;}
.py-l3{border-left-width:120px;border-right-width:120px;border-bottom:60px solid #e5e7eb;}
.py-l4{border-left-width:150px;border-right-width:150px;border-bottom:70px solid #e5e7eb;}

.py-level::before{
  content: attr(data-label);
  position: absolute;
  top: 60%;
  left: 50%;
  transform: translate(-50%,-50%);
  font-weight: 600;
}

.py-level.py-active{
  border-bottom-color: #ece569;
  filter: drop-shadow(0 12px 20px rgba(52,68,2,.35));
}

/* ===== CONTENT STYLES (UNCHANGED) ===== */
.cur-heading h4{font-size:24px;font-style:italic;}
.cur-heading p{max-width:820px;color:#555;line-height:1.6;}

.curriculum-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;}
.curriculum-list{list-style:none;padding:0;margin:0;}
.curriculum-list li{
  padding:14px 18px;
  border:1px solid #eee;
  border-radius:12px;
  margin-bottom:10px;
}

/* ===== RESPONSIVE ===== */
@media(max-width:900px){
  .cur-con-sticky{flex-direction:column;}
  .py-pyramid{width:100%;transform:scale(1);}
  .skills-scroll-wrapper{width:100%;}
}
</style>
</head>

<body>

<div class="cur-con-sec">
  <div class="cur-con-sticky">

    <!-- PYRAMID -->
    <div class="py-pyramid">
      <div class="py-level py-l1 py-active" data-label="01"></div>
      <div class="py-level py-l2" data-label="02"></div>
      <div class="py-level py-l3" data-label="03"></div>
      <div class="py-level py-l4" data-label="04"></div>
    </div>

    <!-- CONTENT -->
    <div class="skills-scroll-wrapper">

      <section class="skills-panel skill-track-section is-active">
        <div class="cur-heading">
          <h4>01: Data Engineering Essentials</h4>
          <p>Kick off your journey by mastering core principles.</p>
        </div>
      </section>

      <section class="skills-panel skill-track-section">
        <div class="cur-heading">
          <h4>02: Platform & Pipeline Architecture</h4>
          <p>Design scalable and secure platforms.</p>
        </div>
      </section>

      <section class="skills-panel skill-track-section">
        <div class="cur-heading">
          <h4>03: Core Tools & Frameworks</h4>
          <p>Hands-on experience with modern tools.</p>
        </div>
      </section>

      <section class="skills-panel skill-track-section">
        <div class="cur-heading">
          <h4>04: Capstone Projects</h4>
          <p>Apply skills in real-world projects.</p>
        </div>
      </section>

    </div>
  </div>
</div>

<script>
(function(){
  const section = document.querySelector('.cur-con-sec');
  const panels = [...document.querySelectorAll('.skills-panel')];
  const levels = [...document.querySelectorAll('.py-level')];
  const total = panels.length;

  function onScroll(){
    const rect = section.getBoundingClientRect();
    const viewH = window.innerHeight;

    const progress = Math.min(
      Math.max(-rect.top / ((total * viewH) - viewH), 0),
      1
    );

    const index = Math.min(total - 1, Math.floor(progress * total));

    panels.forEach((p,i)=>p.classList.toggle('is-active', i===index));
    levels.forEach((l,i)=>l.classList.toggle('py-active', i===index));
  }

  window.addEventListener('scroll', onScroll);
  onScroll();
})();
</script>

</body>
</html>
